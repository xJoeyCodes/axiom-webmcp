services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: axiom
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - axiom-postgres:/var/lib/postgresql/data

volumes:
  axiom-postgres:
